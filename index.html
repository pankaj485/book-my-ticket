<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stellar Seat Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap");
      body {
        font-family: "Outfit", sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
      }
    </style>
  </head>
  <body
    class="min-h-screen flex items-center justify-center p-6 bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900"
  >
    <div
      id="booking-section"
      class="max-w-7xl w-full bg-slate-800/80 backdrop-blur-xl rounded-3xl shadow-2xl p-10 border border-slate-700/50"
    >
      <div class="text-center mb-10">
        <h1
          class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400 mb-4 tracking-tight"
        >
          ChaiCode Cinema - Now Showing<br />
          <br />
          <span class="text-red-400">
            <span class="font-bold">Dhurandhar The Revenge</span>
          </span>
        </h1>
        <p class="text-slate-400 text-lg">Jassi ko ghar ki yaad kyu nhi aai?</p>
        <div class="mt-4 flex items-center justify-center gap-3">
          <span id="user-email" class="text-slate-400 text-sm"></span>
          <button
            onclick="signout()"
            class="text-sm text-rose-400 hover:text-rose-300 border border-rose-500/30 hover:border-rose-400/60 px-3 py-1 rounded-lg transition-all duration-200"
          >
            Sign Out
          </button>
        </div>
      </div>

      <div class="flex justify-center mb-10">
        <div
          class="bg-slate-900/50 rounded-full px-6 py-3 border border-slate-700 flex gap-8 items-center"
        >
          <div class="flex items-center gap-3">
            <div
              class="w-4 h-4 rounded-full bg-emerald-500 shadow-[0_0_12px_rgba(16,185,129,0.6)]"
            ></div>
            <span class="text-slate-300 font-medium tracking-wide"
              >Available</span
            >
          </div>
          <div class="w-px h-6 bg-slate-700"></div>
          <div class="flex items-center gap-3">
            <div
              class="w-4 h-4 rounded-full bg-rose-500/20 border border-rose-500/50"
            ></div>
            <span class="text-slate-400 font-medium tracking-wide">Booked</span>
          </div>
        </div>
      </div>

      <div class="flex justify-center">
        <div
          class="bg-slate-900/40 p-8 rounded-2xl border border-slate-700/50 shadow-inner"
        >
          <table
            id="tbl"
            class="border-separate border-spacing-4 mx-auto"
          ></table>
        </div>
      </div>
    </div>

    <script>
      // managing routes
      const accessToken = localStorage.getItem("access_token");
      if (!accessToken) {
        window.location.href = "/signin";
      }

      document.getElementById("user-email").textContent =
        localStorage.getItem("user_email") || "";

      function signout() {
        localStorage.removeItem("access_token");
        localStorage.removeItem("user_email");
        window.location.href = "/signin";
      }

      async function loadSeats() {
        const tbl = document.getElementById("tbl");
        tbl.innerHTML = "";

        const res = await fetch("/seats", {
          headers: { Authorization: "Bearer " + accessToken },
        });

        if (res.status === 401) {
          signout();
          return;
        }

        const resData = await res.json();
        const seats = resData.data.sort((a, b) => a.id - b.id);

        const baseClasses =
          "w-32 h-32 rounded-2xl text-center align-middle text-2xl font-bold transition-all duration-300 select-none relative group";

        let tr;
        for (let i = 0; i < seats.length; i++) {
          if (i % 8 === 0) tr = tbl.insertRow();

          const td = tr.insertCell();

          if (seats[i].isbooked) {
            td.className = `${baseClasses} bg-rose-500/10 text-rose-500/60 border border-rose-500/20 cursor-not-allowed`;
            const bookedBy = seats[i].name || seats[i].email || "someone";
            td.innerHTML = `
              <span class="relative z-10">${seats[i].id}</span>
              <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-3 px-4 py-2 bg-slate-900 border border-slate-700 text-sm text-slate-300 rounded-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 whitespace-nowrap shadow-2xl z-50 pointer-events-none font-normal">
                Booked by: <span class="font-bold text-white ml-1">${bookedBy}</span>
                <div class="absolute top-full left-1/2 -translate-x-1/2 -mt-[1px] border-[6px] border-transparent border-t-slate-700"></div>
                <div class="absolute top-full left-1/2 -translate-x-1/2 -mt-[2px] border-[5px] border-transparent border-t-slate-900"></div>
              </div>
            `;
          } else {
            td.className = `${baseClasses} bg-emerald-500 text-white border-2 border-emerald-400 shadow-[0_0_20px_rgba(16,185,129,0.3)] cursor-pointer hover:bg-emerald-400 hover:-translate-y-1.5 hover:shadow-[0_10px_25px_rgba(16,185,129,0.5)] active:scale-95`;
            td.innerHTML = `<span class="relative z-10">${seats[i].id}</span>`;
            td.addEventListener("click", () =>
              bookSeat(seats[i].id, td, baseClasses),
            );
          }
        }
      }

      async function bookSeat(id, td, baseClasses) {
        if (td.classList.contains("cursor-not-allowed")) return;

        const name = prompt("Enter your name for the booking:");
        if (!name.trim()) return;

        try {
          const res = await fetch(`/${id}/${encodeURIComponent(name)}`, {
            method: "PUT",
            headers: { Authorization: "Bearer " + accessToken },
          });

          if (res.status === 401) {
            signout();
            return;
          }

          const data = await res.json();

          if (!res.ok) {
            alert(data.message || "Booking failed.");
            return;
          }

          td.className = `${baseClasses} bg-rose-500/10 text-rose-500/60 border border-rose-500/20 cursor-not-allowed`;
          td.innerHTML = `
            <span class="relative z-10">${id}</span>
            <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-3 px-4 py-2 bg-slate-900 border border-slate-700 text-sm text-slate-300 rounded-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 whitespace-nowrap shadow-2xl z-50 pointer-events-none font-normal">
              Booked by: <span class="font-bold text-white ml-1">${name}</span>
              <div class="absolute top-full left-1/2 -translate-x-1/2 -mt-[1px] border-[6px] border-transparent border-t-slate-700"></div>
              <div class="absolute top-full left-1/2 -translate-x-1/2 -mt-[2px] border-[5px] border-transparent border-t-slate-900"></div>
            </div>
          `;
          td.replaceWith(td);
        } catch {
          alert("Network error. Please try again.");
        }
      }

      loadSeats();
    </script>
  </body>
</html>
